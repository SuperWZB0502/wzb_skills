<div class="eyebrow">功能 01 · PROFILING</div><h1>全局总览</h1><p class="sub">按 Step 查看各流水线 Stage 的配置与耗时。点击表头排序，切换百分比查看时间占比。</p>
<div class="summary" data-r="summary"></div>
<div class="filter-hint-anchor"><div class="filter-hint" hidden><span class="filter-hint-label">本行筛选</span><span class="filter-hint-hand" aria-hidden="true">&#9758;</span></div></div>
<div class="card"><div class="toolbar"><label>Step <select data-r="step" aria-label="Step"></select></label><div class="picker-field"><span>Stage</span><details class="stage-picker"><summary aria-label="Stage选择"><span data-r="stage-count"></span> ▾</summary><div class="stage-options"><div class="stage-actions"><button type="button" data-r="stage-all">全选</button><button type="button" data-r="stage-none">清空</button></div><div data-r="stage-options"></div></div></details></div><div class="picker-field"><span>卡号</span><details class="stage-picker"><summary aria-label="卡号选择"><span data-r="rank-count"></span> ▾</summary><div class="stage-options"><div class="stage-actions"><button type="button" data-r="rank-all">全选</button><button type="button" data-r="rank-none">清空</button></div><div data-r="rank-options"></div></div></details></div><label>单位 <select data-r="unit" aria-label="单位"><option value="s" selected>秒（s）</option><option value="ms">毫秒（ms）</option><option value="us">微秒（μs）</option></select></label><label class="mode"><input type="checkbox" role="switch" aria-label="百分比显示" data-r="percentage">百分比</label><button class="download" data-r="download">导出当前表格 CSV</button></div><div class="scroll"><table><caption>全局总览</caption><thead><tr data-r="headers"></tr></thead><tbody data-r="rows"></tbody></table></div><div class="footer"><span data-r="row-count"></span><span data-r="unit-note"></span></div></div>
<p class="note"><b>端到端时间 = 计算 + 未掩盖通信 + Free。</b> 时间占比以当前行端到端时间为分母；层数、重计算与显存保持原值。<br><b>总通信 = 未掩盖通信 + 掩盖通信。</b> 掩盖通信与计算存在重叠，各时间项不能直接全部相加；“—”表示暂无数据。</p><noscript>请允许浏览器运行 JavaScript，或查看随报告导出的 CSV。</noscript>
<script type="application/json" id="rank-step-time-data">__DATA__</script><script>
(()=>{
'use strict';
const root=document.getElementById('rank-step-time');
const data=JSON.parse(root.querySelector('#rank-step-time-data').textContent),overview=data.overview||{};
const q=name=>root.querySelector('[data-r="'+name+'"]'),scales={us:1,ms:1000,s:1000000};
const definitions=overview.columns||data.columns.map(key=>({key,label:key,kind:key==='卡号'?'integer':'time'}));
const steps=Object.keys(data.steps||{}),summary=overview.summary||{};
let cols=[],sortKey=definitions[0]?.key,direction=1,visible=[];
const number=value=>value===null||value===undefined||value===''?null:(Number.isFinite(Number(value))?Number(value):null);
const fixed=value=>value===null?'—':value.toFixed(2);
const chipDefinitions=[['actual_ranks','实际采集卡数'],['profiling_ranks','总卡数'],['GBS','GBS'],['MBS','MBS'],['MBN','MBN'],['PP','PP'],['DP','DP'],['EP','EP'],['CP','CP'],['TP','TP'],['step_time','单Step耗时(s)']];
for(const [key,label] of chipDefinitions){const chip=document.createElement('div'),caption=document.createElement('span'),value=document.createElement('strong');chip.className='chip';chip.dataset.config=key;caption.textContent=label;value.dataset.summary=key;value.textContent=key==='actual_ranks'?String(summary[key]??data.ranks?.length??'—'):String(summary[key]??'—');if(key==='profiling_ranks')chip.title='Profiling 元数据中的 world_size';if(key==='step_time')chip.title='当前 Step 实际采集卡端到端时间的最大值，单位为秒';chip.append(caption,value);q('summary').append(chip);}
for(const step of steps){const option=document.createElement('option');option.value=step;option.textContent=step==='unassigned'?'未分步':step;q('step').append(option);}
function label(col){return col.label;}
function metricValue(row,col){
 const value=number(row[col.key]);if(value===null)return null;
 if(col.kind==='ratio')return value*100;
 if(col.kind==='time'){if(q('percentage').checked){const total=number(row['端到端时间']);return total!==null&&total>0?value/total*100:null;}return value/scales[q('unit').value];}
 return value;
}
function formatCell(row,col,forCSV=false){
 const value=metricValue(row,col);if(value===null)return '—';
 if(col.kind==='integer')return String(value);
 if(col.kind==='memory')return fixed(value);
 if(col.kind==='ratio'||q('percentage').checked&&col.kind==='time')return fixed(value)+'%';
 return forCSV?fixed(value):value.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
const stageOf=row=>String(row.stage??'未知');
const rankOf=row=>String(row['卡号']);
const selectedStages=new Set(),selectedRanks=new Set();
function rebuildPicker(kind,values,selected,text,onChange){
 const panel=q(kind+'-options');
 panel.replaceChildren();
 selected.clear();
 for(const value of values){
  const label=document.createElement('label'),check=document.createElement('input');
  check.type='checkbox';check.value=value;check.checked=true;selected.add(value);
  label.append(check,document.createTextNode(text(value)));
  check.addEventListener('change',()=>{
   if(check.checked)selected.add(value);else selected.delete(value);
   apply();
  });
  panel.append(label);
 }
 function apply(){
  q(kind+'-count').textContent=selected.size+'/'+values.length;
  onChange();
 }
 for(const [action,active] of [['all',true],['none',false]])q(kind+'-'+action).onclick=()=>{
  selected.clear();
  for(const check of panel.querySelectorAll('input')){
   check.checked=active;
   if(active)selected.add(check.value);
  }
  apply();
 };
 apply();
}
function updateScope(){
 const rows=data.steps[q('step').value]||[];
 const stages=[...new Set(rows.map(stageOf))].sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true}));
 rebuildPicker('stage',stages,selectedStages,value=>'Stage '+value,()=>{
  const ranks=[...new Set(rows.filter(row=>selectedStages.has(stageOf(row))).map(rankOf))].sort((a,b)=>Number(a)-Number(b));
  rebuildPicker('rank',ranks,selectedRanks,value=>'Rank '+value,render);
 });
}
const toolbar=root.querySelector('.toolbar');
toolbar.addEventListener('focusout',event=>{
 const picker=event.target.closest('.stage-picker');
 if(picker&&!picker.contains(event.relatedTarget))picker.open=false;
});
toolbar.addEventListener('keydown',event=>{
 const picker=event.target.closest('.stage-picker');
 if(event.key==='Escape'&&picker?.open){picker.open=false;picker.querySelector('summary').focus();}
});
function headers(){
 q('headers').replaceChildren();
 for(const col of cols){const th=document.createElement('th'),button=document.createElement('button'),caption=document.createElement('span'),icon=document.createElement('span');th.scope='col';button.type='button';button.setAttribute('aria-label',label(col));caption.className='header-label';caption.textContent=label(col);icon.className='sort-icon';icon.setAttribute('aria-hidden','true');button.append(caption,icon);button.title=col.description||col.tooltip||label(col);th.addEventListener('click',()=>{direction=sortKey===col.key?-direction:1;sortKey=col.key;render();});th.append(button);q('headers').append(th);}
}
const table=root.querySelector('table');let hoverCell=null;
function clearTableHover(){table.querySelectorAll('.row-hover,.column-hover').forEach(e=>e.classList.remove('row-hover','column-hover'));hoverCell=null;}
table.addEventListener('pointerover',event=>{const cell=event.target.closest('th,td');if(!cell||cell===hoverCell||cell.colSpan>1)return;clearTableHover();hoverCell=cell;for(const row of table.rows)row.cells[cell.cellIndex]?.classList.add('column-hover');if(cell.closest('tbody'))cell.parentElement.classList.add('row-hover');});
table.addEventListener('pointerleave',clearTableHover);
function render(){
 clearTableHover();
 const percent=q('percentage').checked,step=q('step').value,rows=data.steps[step]||[];
 cols=definitions.filter(col=>!col.mode||col.mode===(percent?'percent':'time'));
 if(!cols.some(col=>col.key===sortKey)){sortKey=cols[0]?.key;direction=1;}
 headers();q('unit').disabled=percent;
 visible=rows.filter(row=>selectedStages.has(stageOf(row))&&selectedRanks.has(rankOf(row)));
 const sortCol=cols.find(col=>col.key===sortKey);
 visible.sort((a,b)=>{const left=metricValue(a,sortCol),right=metricValue(b,sortCol);if(left===null)return right===null?number(a['卡号'])-number(b['卡号']):1;if(right===null)return -1;return (left-right)*direction||(number(a['卡号'])-number(b['卡号']));});
 q('rows').replaceChildren();
 const maxima=Object.fromEntries(cols.map(col=>[col.key,Math.max(0,...rows.map(row=>metricValue(row,col)??0))]));
 for(const row of visible){const tr=document.createElement('tr');tr.dataset.rank=row['卡号'];for(const col of cols){const td=document.createElement('td'),value=metricValue(row,col);td.textContent=formatCell(row,col);td.dataset.key=col.key;if(col.key==='stage'||col.key==='卡号'){td.title='Stage：'+(row.stage??'—')+'；原始卡号（rank）：'+row['卡号']+(row.pp_group!==undefined?'；PP 分组：'+(typeof row.pp_group==='object'?JSON.stringify(row.pp_group):row.pp_group):'');}else if(col.kind==='time'||col.kind==='ratio'){td.className='metric';const width=percent?value:maxima[col.key]?value/maxima[col.key]*100:0;td.style.setProperty('--pct',Math.max(0,Math.min(100,width??0))+'%');td.title=value===null?'暂无数据':col.kind==='ratio'?'理论 bubble = (PP − 1) / (MBN + PP − 1)':'原始值：'+fixed(number(row[col.key]))+' μs'+(percent?'；分母：'+fixed(number(row['端到端时间']))+' μs':'');}else if(col.kind==='memory'){td.title='显存峰值（GiB）';}tr.append(td);}q('rows').append(tr);}
 if(!visible.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=cols.length;td.className='empty';td.textContent='没有匹配的 Stage / 卡号';tr.append(td);q('rows').append(tr);}
 [...q('headers').children].forEach((th,i)=>{const active=cols[i].key===sortKey;th.setAttribute('aria-sort',active?(direction===1?'ascending':'descending'):'none');});
 const stepTime=number(overview.step_time_us?.[step]);root.querySelector('[data-summary="step_time"]').textContent=fixed(stepTime===null?null:stepTime/1000000);
 q('row-count').textContent='显示 '+visible.length+' / '+rows.length+' 张采集卡';
 q('unit-note').textContent=percent?'时间占比：各项 ÷ 当前行端到端时间 × 100%；理论 bubble 按公式计算':'时间单位：'+({us:'微秒（μs）',ms:'毫秒（ms）',s:'秒（s）'}[q('unit').value])+'；显存单位：GiB';
}
for(const control of ['unit','percentage'])q(control).addEventListener('change',render);
q('step').addEventListener('change',updateScope);
const csvCell=value=>/[",\r\n]/.test(String(value))?'"'+String(value).replace(/"/g,'""')+'"':String(value);
q('download').addEventListener('click',()=>{const content='\uFEFF'+[cols.map(label),...visible.map(row=>cols.map(col=>formatCell(row,col,true)))].map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='overview_step_'+q('step').value.replace(/[^a-zA-Z0-9_-]/g,'_')+'_'+(q('percentage').checked?'percent':q('unit').value)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
updateScope();
function watchFilterHints(){
 const page=document.documentElement;
 if(page.hasAttribute('data-filter-hints-watching'))return;
 page.setAttribute('data-filter-hints-watching','');
 const hints=document.querySelectorAll('#rank-step-time .filter-hint, #pp-schedule .filter-hint');
 const observer=new IntersectionObserver(entries=>{
  if(!entries.some(entry=>entry.intersectionRatio>=.5))return;
  observer.disconnect();
  for(const hint of hints)hint.hidden=false;
  setTimeout(()=>{for(const hint of hints)hint.hidden=true;},20000);
 },{threshold:.5});
 for(const section of document.querySelectorAll('#rank-step-time .toolbar, #pp-schedule .filter-toolbar')){
  observer.observe(section.firstElementChild);
 }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watchFilterHints,{once:true});
else watchFilterHints();
})();
</script></section>
